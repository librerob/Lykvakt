name: Validate
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      prepare_release:
        description: Prepare a draft prerelease after validation
        type: boolean
        default: false
        required: true
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=moderate
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: xvfb-run -a node tests/visibility.mjs
      - run: npm run bench
      - run: npm run package
      - run: node scripts/metrics.mjs artifacts/metrics-after.json
      - run: node tests/performance.mjs artifacts/popup-after.json
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        if: github.event_name == 'pull_request' && github.head_ref == 'imports-1'
        with:
          ref: ea5d79f22ade26579533ffe961150a03566b7845
          path: .baseline
      - name: Measure pre-import main on this same runner
        if: github.event_name == 'pull_request' && github.head_ref == 'imports-1'
        run: |
          cd .baseline
          npm ci --ignore-scripts
          npm run build
          npm run bench
          node ../scripts/metrics.mjs ../artifacts/metrics-before.json
          node ../tests/performance.mjs ../artifacts/popup-before.json
          cp artifacts/bench.json ../artifacts/bench-before.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: synthetic-validation
          path: |
            artifacts/screenshots/
            artifacts/axe-*.json
            artifacts/browser-results.json
            artifacts/browser-failure.txt
            artifacts/bench*.json
            artifacts/metrics-*.json
            artifacts/popup-*.json
            artifacts/*.zip
            artifacts/*.sha256
          if-no-files-found: ignore
          retention-days: 14
  release:
    if: github.event_name == 'workflow_dispatch' && inputs.prepare_release && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: synthetic-validation
          path: release-assets
      - name: Prepare the draft without replacing a published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node -e "const fs=require('fs');const text=fs.readFileSync('CHANGELOG.md','utf8').split(/\n## /)[1];fs.writeFileSync('release-notes.md','## '+text)"
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          if gh release view "$tag" --json isDraft --jq '.isDraft' > draft-state.txt 2>/dev/null; then
            test "$(cat draft-state.txt)" = true
            gh release edit "$tag" --target "$GITHUB_SHA" --notes-file release-notes.md --prerelease --draft
            gh release upload "$tag" release-assets/*.zip release-assets/*.sha256 --clobber
          else
            gh release create "$tag" release-assets/*.zip release-assets/*.sha256 --target "$GITHUB_SHA" --title "Lykvakt $version" --notes-file release-notes.md --prerelease --draft
          fi
