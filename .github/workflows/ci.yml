name: Validate preview
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      prepare_release:
        description: Prepare an unaudited draft prerelease after validation
        type: boolean
        default: false
        required: true
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=moderate
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: node tests/passkeys.mjs
      - run: xvfb-run -a node tests/visibility.mjs
      - run: npm run bench
      - run: npm run package
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: synthetic-preview-validation
          path: |
            artifacts/screenshots/
            artifacts/axe-*.json
            artifacts/browser-results.json
            artifacts/browser-failure.txt
            artifacts/bench.json
            artifacts/passkey-results.json
            artifacts/*.zip
            artifacts/*.sha256
          if-no-files-found: ignore
          retention-days: 14
  release:
    if: github.event_name == 'workflow_dispatch' && inputs.prepare_release && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: synthetic-preview-validation
          path: release-assets
      - name: Create draft prerelease without replacing any existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create v0.1.0-rc.1
          release-assets/*.zip release-assets/*.sha256
          --target "$GITHUB_SHA"
          --title "OTP Vault 0.1.0-rc.1 — unaudited preview"
          --notes-file docs/release-notes.md
          --prerelease --draft
